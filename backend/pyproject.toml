[project]
name = "resq-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14", "asyncpg>=0.30", "fastapi>=0.115", "httpx>=0.28", "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7", "sqlalchemy[asyncio]>=2.0", "uvicorn[standard]>=0.34"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
